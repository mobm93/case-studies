<svg xmlns="http://www.w3.org/2000/svg" width="670" height="226" viewBox="0 0 670 226" role="img" aria-label="Token cost per tool call — MCP vs native tools">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t  { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .st { font-size: 11.5px; fill: #656d76; }
    .lb { font-size: 12px; fill: #1f2328; }
    .vl { font-size: 12px; font-weight: 600; }
    .nt { font-size: 11px; fill: #656d76; }
  </style>
  <rect x="0.5" y="0.5" width="669" height="225" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="t" x="20" y="28">Token cost per tool call — MCP vs native tools</text>
  <text class="st" x="20" y="46">Measured across 3,236 tool calls in 9 agent sessions (2026-07-16 to 2026-08-16)</text>
  <text class="lb" x="20" y="75">MCP: list deployments</text>
  <rect x="210" y="65" width="330" height="13" rx="3" fill="#e6eaef"/>
  <rect x="210" y="65" width="330" height="13" rx="3" fill="#cf222e"/>
  <text class="vl" x="550" y="76" fill="#cf222e">11,781</text>
  <text class="lb" x="20" y="101">MCP: DB advisors</text>
  <rect x="210" y="91" width="330" height="13" rx="3" fill="#e6eaef"/>
  <rect x="210" y="91" width="195" height="13" rx="3" fill="#cf222e"/>
  <text class="vl" x="550" y="102" fill="#cf222e">6,951</text>
  <text class="lb" x="20" y="127">MCP average (all calls)</text>
  <rect x="210" y="117" width="330" height="13" rx="3" fill="#e6eaef"/>
  <rect x="210" y="117" width="32" height="13" rx="3" fill="#9a6700"/>
  <text class="vl" x="550" y="128" fill="#9a6700">1,146</text>
  <text class="lb" x="20" y="153">Native tool average</text>
  <rect x="210" y="143" width="330" height="13" rx="3" fill="#e6eaef"/>
  <rect x="210" y="143" width="8" height="13" rx="3" fill="#1a7f37"/>
  <text class="vl" x="550" y="154" fill="#1a7f37">290</text>
  <text class="lb" x="20" y="179">Shell (gh CLI) average</text>
  <rect x="210" y="169" width="330" height="13" rx="3" fill="#e6eaef"/>
  <rect x="210" y="169" width="7" height="13" rx="3" fill="#1a7f37"/>
  <text class="vl" x="550" y="180" fill="#1a7f37">236</text>
  <text class="nt" x="20" y="214">Same answer — "did this commit deploy green?" — for 1/50th the tokens. Both MCP servers were switched off.</text>

</svg>
